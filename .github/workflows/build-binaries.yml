name: Build standalone binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: fuselapse-macos
            artifact_path: dist/Fuselapse-macos.zip
            ffmpeg_dir: ffmpeg-macos
            ffmpeg_bin: ffmpeg-macos/ffmpeg
            ffmpeg_url: https://evermeet.cx/ffmpeg/ffmpeg-7.1.1.zip
          - os: windows-latest
            artifact_name: fuselapse-windows
            artifact_path: dist/Fuselapse.exe
            ffmpeg_dir: ffmpeg-windows
            ffmpeg_bin: ffmpeg-windows/ffmpeg.exe
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download ffmpeg for macOS
        if: runner.os == 'macOS'
        run: |
          curl -L "${{ matrix.ffmpeg_url }}" -o ffmpeg.zip
          mkdir -p "${{ matrix.ffmpeg_dir }}"
          unzip -j ffmpeg.zip -d "${{ matrix.ffmpeg_dir }}"
          chmod +x "${{ matrix.ffmpeg_bin }}"

      - name: Download ffmpeg for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "${{ matrix.ffmpeg_url }}" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          $ffmpegExe = Get-ChildItem -Path ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpegExe) {
            throw "ffmpeg.exe was not found in the downloaded archive."
          }
          New-Item -ItemType Directory -Force -Path "${{ matrix.ffmpeg_dir }}" | Out-Null
          Copy-Item $ffmpegExe.FullName "${{ matrix.ffmpeg_bin }}"

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_CODESIGN_IDENTITY != ''
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > developer-id.p12
          security create-keychain -p runner fuselapse-build.keychain
          security set-keychain-settings -lut 21600 fuselapse-build.keychain
          security unlock-keychain -p runner fuselapse-build.keychain
          security import developer-id.p12 -k fuselapse-build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s fuselapse-build.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k runner fuselapse-build.keychain

      - name: Write entitlements file
        if: runner.os == 'macOS' && secrets.MACOS_ENTITLEMENTS_PLIST_BASE64 != ''
        env:
          MACOS_ENTITLEMENTS_PLIST_BASE64: ${{ secrets.MACOS_ENTITLEMENTS_PLIST_BASE64 }}
        run: |
          echo "$MACOS_ENTITLEMENTS_PLIST_BASE64" | base64 -D > macos-entitlements.plist

      - name: Build one-file executable
        env:
          FUSELAPSE_FFMPEG: ${{ github.workspace }}/${{ matrix.ffmpeg_bin }}
          MACOS_CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          MACOS_ENTITLEMENTS_FILE: ${{ runner.os == 'macOS' && secrets.MACOS_ENTITLEMENTS_PLIST_BASE64 != '' && format('{0}/macos-entitlements.plist', github.workspace) || '' }}
        run: pyinstaller --clean --noconfirm fuselapse.spec

      - name: Assert sample files are not part of shipped artifacts
        shell: bash
        run: |
          test ! -e dist/3dbenchy-crop-trim.mov
          test ! -e dist/timelapse.mp4
          test ! -e dist/regions.json

      - name: Show macOS signature identity
        if: runner.os == 'macOS'
        run: codesign -dv --verbose=4 dist/Fuselapse 2>&1 | grep '^Authority=' || true

      - name: Fail if macOS build is not signed with Developer ID
        if: runner.os == 'macOS' && secrets.MACOS_CODESIGN_IDENTITY != ''
        run: |
          codesign -dv --verbose=4 dist/Fuselapse 2>&1 | tee codesign-details.txt
          grep -q '^Authority=Developer ID Application:' codesign-details.txt

      - name: Package macOS binary for distribution
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Fuselapse dist/Fuselapse-macos.zip

      - name: Notarize macOS archive
        if: runner.os == 'macOS' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER_ID != '' && secrets.APPLE_NOTARY_PRIVATE_KEY != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$HOME/.private_keys/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          xcrun notarytool submit dist/Fuselapse-macos.zip \
            --key "$HOME/.private_keys/AuthKey_$APPLE_NOTARY_KEY_ID.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee notary-result.json

      - name: Validate macOS code signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Fuselapse
          codesign -dv --verbose=4 dist/Fuselapse

      - name: Validate notarization result
        if: runner.os == 'macOS' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER_ID != '' && secrets.APPLE_NOTARY_PRIVATE_KEY != ''
        run: |
          python3 -c "import json, pathlib, sys; data=json.loads(pathlib.Path('notary-result.json').read_text()); status=data.get('status'); print(f'Notarization status: {status}'); sys.exit(0 if status == 'Accepted' else 1)"

      - name: Clean up macOS signing material
        if: runner.os == 'macOS' && always()
        run: |
          rm -f macos-entitlements.plist
          rm -f codesign-details.txt
          rm -f developer-id.p12
          rm -f notary-result.json
          rm -f "$HOME/.private_keys"/AuthKey_*.p8
          security delete-keychain fuselapse-build.keychain || true

      - name: Upload binary artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  release:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Fuselapse build ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/fuselapse-macos/Fuselapse-macos.zip
            release-assets/fuselapse-windows/Fuselapse.exe

  comment_on_pr:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Comment with artifact links
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const issue_number = context.payload.pull_request.number;
            const marker = "<!-- fuselapse-build-artifacts -->";
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id,
                per_page: 100,
              },
              (response) => response.data.artifacts
            );

            const links = artifacts
              .filter((artifact) => !artifact.expired)
              .map((artifact) => {
                const url = `https://github.com/${owner}/${repo}/actions/runs/${run_id}/artifacts/${artifact.id}`;
                return `- [${artifact.name}](${url})`;
              })
              .join("\n");

            const body = [
              marker,
              "Standalone binaries are ready for this PR:",
              "",
              links || `- [Open workflow run](https://github.com/${owner}/${repo}/actions/runs/${run_id})`,
              "",
              `Run page: https://github.com/${owner}/${repo}/actions/runs/${run_id}`,
            ].join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100,
              },
              (response) => response.data
            );

            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
